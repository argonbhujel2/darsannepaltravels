{% extends 'admin/base.html' %}
{% block title %}Services{% endblock %}
{% block content %}
<div class="admin-header"><h1>Services</h1><a href="{{ url_for('admin.service_new') }}" class="btn btn-primary btn-sm">+ New</a></div>
<div class="admin-card"><div class="table-wrap"><table>
<thead><tr><th>Title</th><th>Slug</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>{% for s in services %}
<tr><td>{{ s.title }}</td><td>{{ s.slug }}</td><td>{{ s.status }}</td>
<td><a href="{{ url_for('admin.service_edit', id=s.id) }}">Edit</a>
<form method="post" action="{{ url_for('admin.service_delete', id=s.id) }}" style="display:inline" data-confirm="Delete?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn btn-ghost btn-sm" style="color:var(--color-danger)">Delete</button></form></td></tr>
{% else %}<tr><td colspan="4">None.</td></tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
