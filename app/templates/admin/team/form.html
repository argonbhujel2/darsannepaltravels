{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if member else 'New' }} Team Member{% endblock %}
{% block content %}
<div class="admin-header"><h1>{{ 'Edit' if member else 'New' }} Team Member</h1></div>
<form method="post" class="admin-card admin-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required value="{{ member.name if member else '' }}"></div>
<div class="form-group"><label class="form-label">Position</label><input type="text" name="position" class="form-control" value="{{ member.position if member else '' }}"></div>
<div class="form-group"><label class="form-label">Bio</label><textarea name="bio" class="form-control" rows="3">{{ member.bio if member else '' }}</textarea></div>
<div class="form-group"><label class="form-label">Languages</label><input type="text" name="languages" class="form-control" value="{{ member.languages if member else '' }}"></div>
<div class="form-group"><label class="form-label">Specialization</label><input type="text" name="specialization" class="form-control" value="{{ member.specialization if member else '' }}"></div>
<div class="form-group"><label class="form-label">Experience</label><input type="text" name="experience" class="form-control" value="{{ member.experience if member else '' }}"></div>
{% if member %}<div class="form-group"><label class="form-label">Status</label><select name="status" class="form-control form-select"><option value="active">Active</option><option value="inactive" {% if member.status=='inactive' %}selected{% endif %}>Inactive</option></select></div>{% endif %}
<div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('admin.team_list') }}" class="btn btn-outline">Cancel</a></div>
</form>
{% endblock %}
