{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if destination else 'New' }} Destination{% endblock %}
{% block content %}
<div class="admin-header"><h1>{{ 'Edit' if destination else 'New' }} Destination</h1></div>
<form method="post" class="admin-card admin-form" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label class="form-label">Name *</label><input type="text" name="name" id="title" class="form-control" required value="{{ destination.name if destination else '' }}"></div>
<div class="form-group"><label class="form-label">Slug</label><input type="text" name="slug" id="slug" class="form-control" value="{{ destination.slug if destination else '' }}"></div>
<div class="form-group"><label class="form-label">Short Description</label><textarea name="short_description" class="form-control" rows="2">{{ destination.short_description if destination else '' }}</textarea></div>
<div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4">{{ destination.description if destination else '' }}</textarea></div>
<div class="form-group"><label class="form-label">Best Time</label><input type="text" name="best_time" class="form-control" value="{{ destination.best_time if destination else '' }}"></div>
<div class="form-group"><label class="form-label">Featured Image</label>
{% if destination and destination.featured_image %}<div style="margin-bottom:0.5rem"><img src="{{ destination.featured_image }}" alt="" style="max-height:100px;border-radius:8px"></div>{% endif %}
<input type="file" name="featured_image_file" class="form-control" accept="image/*">
<input type="url" name="featured_image" class="form-control" style="margin-top:0.5rem" placeholder="Or image URL" value="{{ destination.featured_image if destination else '' }}">
</div>
<div class="form-group"><label class="form-label">Status</label><select name="status" class="form-control form-select"><option value="published">Published</option><option value="draft" {% if destination and destination.status=='draft' %}selected{% endif %}>Draft</option></select></div>
<div class="form-group"><label><input type="checkbox" name="featured" value="1" {% if destination and destination.featured %}checked{% endif %}> Featured</label></div>
<div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('admin.destinations_list') }}" class="btn btn-outline">Cancel</a></div>
</form>
{% endblock %}
