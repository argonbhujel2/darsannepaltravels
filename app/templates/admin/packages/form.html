{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if package else 'New' }} Package{% endblock %}
{% block content %}
<div class="admin-header"><h1>{{ 'Edit' if package else 'New' }} Package</h1></div>
<form method="post" class="admin-card admin-form" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label class="form-label">Title *</label><input type="text" name="title" id="title" class="form-control" required value="{{ package.title if package else '' }}"></div>
  <div class="form-group"><label class="form-label">Slug</label><input type="text" name="slug" id="slug" class="form-control" value="{{ package.slug if package else '' }}"></div>
  <div class="form-group">
    <label class="form-label">Featured Image</label>
    {% if package and package.featured_image %}
    <div style="margin-bottom:0.5rem"><img src="{{ package.featured_image }}" alt="" style="max-height:100px;border-radius:8px"></div>
    {% endif %}
    <input type="file" name="featured_image_file" class="form-control" accept="image/*">
    <input type="url" name="featured_image" class="form-control" style="margin-top:0.5rem" placeholder="Or paste image URL" value="{{ package.featured_image if package else '' }}">
  </div>
  <div class="form-group"><label class="form-label">Short Description</label><textarea name="short_description" class="form-control" rows="2">{{ package.short_description if package else '' }}</textarea></div>
  <div class="form-group"><label class="form-label">Full Description</label><textarea name="full_description" class="form-control" rows="5">{{ package.full_description if package else '' }}</textarea></div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Destination</label><input type="text" name="destination" class="form-control" value="{{ package.destination if package else '' }}"></div>
    <div class="form-group"><label class="form-label">Duration</label><input type="text" name="duration" class="form-control" placeholder="e.g. 6 Days" value="{{ package.duration if package else '' }}"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Duration Days</label><input type="number" name="duration_days" class="form-control" value="{{ package.duration_days if package else '' }}"></div>
    <div class="form-group"><label class="form-label">Starting Price</label><input type="text" name="starting_price" class="form-control" value="{{ package.starting_price if package else 'On Request' }}"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Price Type</label>
      <select name="price_type" class="form-control form-select">
        {% for t in ['On Request','Starting From','Per Person','Per Group','Contact for Price'] %}
        <option value="{{ t }}" {% if package and package.price_type==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label class="form-label">Travel Type</label>
      <select name="travel_type" class="form-control form-select">
        <option value="">—</option>
        {% for t in ['Adventure','Trekking','Pilgrimage','Family','School','Team','Sightseeing','Cultural'] %}
        <option value="{{ t }}" {% if package and package.travel_type==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Difficulty</label>
      <select name="difficulty" class="form-control form-select">
        <option value="">—</option>
        {% for d in ['Easy','Moderate','Challenging'] %}
        <option value="{{ d }}" {% if package and package.difficulty==d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label class="form-label">Status</label>
      <select name="status" class="form-control form-select">
        <option value="published" {% if package and package.status=='published' %}selected{% endif %}>Published</option>
        <option value="draft" {% if package and package.status=='draft' %}selected{% endif %}>Draft</option>
      </select>
    </div>
  </div>
  <div class="form-group"><label class="form-label">Highlights (one per line)</label><textarea name="highlights" class="form-control" rows="4">{{ package.highlights if package else '' }}</textarea></div>
  <div class="form-group"><label class="form-label">Included</label><textarea name="included" class="form-control" rows="3">{{ package.included if package else '' }}</textarea></div>
  <div class="form-group"><label class="form-label">Excluded</label><textarea name="excluded" class="form-control" rows="3">{{ package.excluded if package else '' }}</textarea></div>
  <div class="form-group"><label class="form-label">Best Time</label><input type="text" name="best_time" class="form-control" value="{{ package.best_time if package else '' }}"></div>
  <div class="form-group"><label><input type="checkbox" name="featured" value="1" {% if package and package.featured %}checked{% endif %}> Featured</label></div>
  <div class="form-group"><label class="form-label">SEO Title</label><input type="text" name="seo_title" class="form-control" value="{{ package.seo_title if package else '' }}"></div>
  <div class="form-group"><label class="form-label">SEO Description</label><textarea name="seo_description" class="form-control" rows="2">{{ package.seo_description if package else '' }}</textarea></div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin.packages_list') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
