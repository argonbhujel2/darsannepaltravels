{% extends 'admin/base.html' %}
{% block title %}Blog{% endblock %}
{% block content %}
<div class="admin-header"><h1>Blog Posts</h1><a href="{{ url_for('admin.blog_new') }}" class="btn btn-primary btn-sm">+ New Post</a></div>
<div class="admin-card"><div class="table-wrap"><table>
<thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>{% for p in posts %}
<tr><td>{{ p.title }}</td><td>{{ p.category or '—' }}</td><td>{{ p.status }}</td>
<td><a href="{{ url_for('admin.blog_edit', id=p.id) }}">Edit</a>
<form method="post" action="{{ url_for('admin.blog_delete', id=p.id) }}" style="display:inline" data-confirm="Delete?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn btn-ghost btn-sm" style="color:var(--color-danger)">Delete</button></form></td></tr>
{% else %}<tr><td colspan="4">None.</td></tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
