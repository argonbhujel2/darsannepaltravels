{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if post else 'New' }} Post{% endblock %}
{% block content %}
<div class="admin-header"><h1>{{ 'Edit' if post else 'New' }} Post</h1></div>
<form method="post" class="admin-card admin-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label class="form-label">Title *</label><input type="text" name="title" id="title" class="form-control" required value="{{ post.title if post else '' }}"></div>
<div class="form-group"><label class="form-label">Slug</label><input type="text" name="slug" id="slug" class="form-control" value="{{ post.slug if post else '' }}"></div>
<div class="form-group"><label class="form-label">Excerpt</label><textarea name="excerpt" class="form-control" rows="2">{{ post.excerpt if post else '' }}</textarea></div>
<div class="form-group"><label class="form-label">Content</label><textarea name="content" class="form-control" rows="10">{{ post.content if post else '' }}</textarea></div>
<div class="form-row">
<div class="form-group"><label class="form-label">Category</label>
<select name="category" class="form-control form-select">
{% for c in ['Travel Guide','Destination Guide','Trekking','Pilgrimage','Travel Tips','Nepal Culture','Road Trips','Tour Updates'] %}
<option value="{{ c }}" {% if post and post.category==c %}selected{% endif %}>{{ c }}</option>
{% endfor %}
</select></div>
<div class="form-group"><label class="form-label">Status</label>
<select name="status" class="form-control form-select">
<option value="published" {% if post and post.status=='published' %}selected{% endif %}>Published</option>
<option value="draft" {% if not post or post.status=='draft' %}selected{% endif %}>Draft</option>
</select></div>
</div>
<div class="form-group"><label class="form-label">Tags</label><input type="text" name="tags" class="form-control" value="{{ post.tags if post else '' }}"></div>
<div class="form-group"><label class="form-label">Author</label><input type="text" name="author" class="form-control" value="{{ post.author if post else 'Darshan Nepal Travel' }}"></div>
<div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('admin.blog_list') }}" class="btn btn-outline">Cancel</a></div>
</form>
{% endblock %}
