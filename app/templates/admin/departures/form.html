{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if departure else 'New' }} Departure{% endblock %}
{% block content %}
<div class="admin-header"><h1>{{ 'Edit' if departure else 'New' }} Departure</h1></div>
<form method="post" class="admin-card admin-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label class="form-label">Package *</label>
<select name="package_id" class="form-control form-select" required>
{% for p in packages %}<option value="{{ p.id }}" {% if departure and departure.package_id==p.id %}selected{% endif %}>{{ p.title }}</option>{% endfor %}
</select></div>
<div class="form-row">
<div class="form-group"><label class="form-label">Departure Date *</label><input type="date" name="departure_date" class="form-control" required value="{{ departure.departure_date.isoformat() if departure and departure.departure_date else '' }}"></div>
<div class="form-group"><label class="form-label">Return Date</label><input type="date" name="return_date" class="form-control" value="{{ departure.return_date.isoformat() if departure and departure.return_date else '' }}"></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">Available Seats</label><input type="number" name="available_seats" class="form-control" value="{{ departure.available_seats if departure else 0 }}"></div>
<div class="form-group"><label class="form-label">Total Seats</label><input type="number" name="total_seats" class="form-control" value="{{ departure.total_seats if departure else 0 }}"></div>
</div>
<div class="form-group"><label class="form-label">Price</label><input type="text" name="price" class="form-control" value="{{ departure.price if departure else '' }}"></div>
<div class="form-group"><label class="form-label">Pickup</label><input type="text" name="pickup_location" class="form-control" value="{{ departure.pickup_location if departure else '' }}"></div>
<div class="form-group"><label class="form-label">Status</label>
<select name="status" class="form-control form-select">
{% for s in ['Open','Filling Fast','Almost Full','Sold Out','Completed','Cancelled'] %}
<option value="{{ s }}" {% if departure and departure.status==s %}selected{% endif %}>{{ s }}</option>
{% endfor %}
</select></div>
<div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="{{ url_for('admin.departures_list') }}" class="btn btn-outline">Cancel</a></div>
</form>
{% endblock %}
