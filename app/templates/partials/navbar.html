<header class="navbar transparent" id="navbar">
  <div class="navbar-inner">
    <a href="{{ url_for('main.home') }}" class="logo" aria-label="{{ business_name }} Home">
      {% if logo_url %}
      <img src="{{ logo_url }}" alt="{{ business_name }}" class="logo-img" width="40" height="40">
      {% else %}
      <span class="logo-mark">DN</span>
      {% endif %}
      <span class="logo-text">Darshan Nepal<span>Travel &amp; Tours</span></span>
    </a>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="{{ url_for('main.home') }}" class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('destinations.list_destinations') }}" class="nav-link {% if request.blueprint == 'destinations' %}active{% endif %}">Destinations</a>
      <a href="{{ url_for('packages.list_packages') }}" class="nav-link {% if request.blueprint == 'packages' %}active{% endif %}">Packages</a>
      <a href="{{ url_for('services.list_services') }}" class="nav-link {% if request.blueprint == 'services' %}active{% endif %}">Services</a>
      <a href="{{ url_for('main.about') }}" class="nav-link {% if request.endpoint == 'main.about' %}active{% endif %}">About Us</a>
      <a href="{{ url_for('main.contact') }}" class="nav-link {% if request.endpoint == 'main.contact' %}active{% endif %}">Contact</a>
      <a href="{{ url_for('enquiries.plan_trip') }}" class="btn btn-secondary btn-sm nav-cta">Plan Your Trip</a>
    </nav>

    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
  <a href="{{ url_for('main.home') }}" class="nav-link">Home</a>
  <a href="{{ url_for('destinations.list_destinations') }}" class="nav-link">Destinations</a>
  <a href="{{ url_for('packages.list_packages') }}" class="nav-link">Packages</a>
  <a href="{{ url_for('services.list_services') }}" class="nav-link">Services</a>
  <a href="{{ url_for('fixed_departures.list_departures') }}" class="nav-link">Fixed Departures</a>
  <a href="{{ url_for('blog.list_posts') }}" class="nav-link">Travel Stories</a>
  <a href="{{ url_for('main.about') }}" class="nav-link">About Us</a>
  <a href="{{ url_for('main.contact') }}" class="nav-link">Contact</a>
  <div class="mobile-nav-cta">
    <a href="{{ url_for('enquiries.plan_trip') }}" class="btn btn-primary btn-block">Plan Your Trip</a>
    <a href="tel:{{ business_phone }}" class="btn btn-outline btn-block">Call {{ business_phone }}</a>
  </div>
</nav>
